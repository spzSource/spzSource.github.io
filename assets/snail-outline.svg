<svg xmlns="http://www.w3.org/2000/svg" width="30" height="13" viewBox="0 0 30 13">
  <!-- silhouette: eyestalks + eyes, head, shell dome, body, foot -->
  <!-- stalk A (vertical) -->
  <rect x="21" y="0" width="2" height="2"/>
  <rect x="22" y="2" width="1" height="4"/>
  <!-- stalk B (diagonal) -->
  <rect x="27" y="0" width="2" height="2"/>
  <rect x="27" y="2" width="1" height="1"/>
  <rect x="26" y="3" width="1" height="1"/>
  <rect x="25" y="4" width="1" height="1"/>
  <rect x="24" y="5" width="1" height="1"/>
  <!-- head -->
  <rect x="22" y="5" width="3" height="1"/>
  <rect x="22" y="6" width="5" height="1"/>
  <rect x="22" y="7" width="5" height="1"/>
  <rect x="21" y="8" width="6" height="1"/>
  <!-- shell dome -->
  <rect x="9"  y="2" width="7" height="1"/>
  <rect x="6"  y="3" width="13" height="1"/>
  <rect x="5"  y="4" width="15" height="1"/>
  <rect x="4"  y="5" width="16" height="3"/>
  <rect x="5"  y="8" width="15" height="1"/>
  <!-- body / foot -->
  <rect x="3"  y="9" width="19" height="1"/>
  <rect x="2"  y="10" width="21" height="1"/>
  <rect x="1"  y="11" width="23" height="1"/>
  <rect x="0"  y="12" width="25" height="1"/>
</svg>
