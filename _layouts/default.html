<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="preload" href="{{ '/assets/fonts/DepartureMono-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/logo.svg' | relative_url }}">
  {% seo title=false %}
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <nav class="top-nav wrap" aria-label="Primary">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="nav-links">
        <a href="{{ '/' | relative_url }}">posts</a>
        <a href="{{ '/feed.xml' | relative_url }}">rss</a>
        <a href="https://github.com/{{ site.github_username }}" rel="me">github</a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" rel="me">linkedin</a>
      </span>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer wrap">
    <span class="footer-right">© {{ 'now' | date: '%Y' }} · <a href="mailto:{{ site.email }}">{{ site.email }}</a></span>
  </footer>
</body>
</html>
