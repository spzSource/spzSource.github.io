<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="preload" href="{{ '/assets/fonts/source-serif-4/source-serif-4-latin-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/DepartureMono-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <style>{% include source-serif-4.css %}{% include style.css %}</style>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/logo.svg' | relative_url }}">
  {% seo title=false %}
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <nav class="top-nav wrap" aria-label="Primary">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <script>
        (function () {
          var brand = document.currentScript.previousElementSibling;
          var text = brand.textContent;
          brand.textContent = '';
          // aria-label must match the visible text, which uses non-breaking
          // spaces, otherwise Lighthouse flags a label-content-name-mismatch
          brand.setAttribute('aria-label', text.replace(/ /g, '\u00A0'));
          var spans = [];
          for (var i = 0; i < text.length; i++) {
            var s = document.createElement('span');
            s.className = 'ch';
            s.textContent = text[i] === ' ' ? '\u00A0' : text[i];
            s.setAttribute('aria-hidden', 'true');
            brand.appendChild(s);
            spans.push(s);
          }
          var i = 0;
          function step() {
            if (i > 0) {
              spans[i - 1].classList.remove('cursor');
              spans[i - 1].classList.add('typed');
            }
            if (i < spans.length) {
              spans[i].classList.add('cursor');
              i++;
              setTimeout(step, 90 + Math.random() * 140);
            } else {
              var caret = document.createElement('span');
              caret.className = 'ch cursor cursor-blink caret';
              caret.setAttribute('aria-hidden', 'true');
              brand.appendChild(caret);
            }
          }
          setTimeout(step, 400);
        })();
      </script>
      <span class="nav-links">
        <a href="{{ '/' | relative_url }}">posts</a>
        <a href="{{ '/feed.xml' | relative_url }}">rss</a>
        <a href="https://github.com/{{ site.github_username }}" rel="me">github</a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" rel="me">linkedin</a>
      </span>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer wrap">
    <span class="footer-right">© {{ 'now' | date: '%Y' }} · <a href="mailto:{{ site.email }}">{{ site.email }}</a></span>
  </footer>
</body>
</html>
